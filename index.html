<!DOCTYPE html>
<html>
<head>
    <title>STC Segregation Tool</title>
    <style>
        body {
            background-color: #11315A;
            font-family: Arial, sans-serif;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #0d2340;
            padding: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 2em;
            color: #ffffff;
        }
        form {
            margin: 40px auto;
            padding: 20px;
            background-color: #1c3f6e;
            border-radius: 8px;
            width: 50%;
        }
        input[type="file"], button {
            margin: 10px;
            padding: 10px;
            font-size: 1em;
        }
        button {
            background-color: #f0ad4e;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: #000;
        }
        button:hover {
            background-color: #ec971f;
        }
        a {
            color: #f0ad4e;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>STC Segregation Tool</h1>
    </header>

    <h2>Upload Excel File</h2>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <br>
        <button type="submit">Upload & Process</button>
    </form>
</body>
</html>
